[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-data-pipeline"
version = "0.1.0"
description = "Reusable time-series ingestion and cleaning pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "statsmodels>=0.14",
    "ta>=0.11",
    "yfinance>=0.2",
]

[project.optional-dependencies]
docs = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_data_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-report=xml:coverage/coverage.xml --cov-report=json:coverage/coverage.json --cov-report=html:coverage/html"
markers = [
    "integration: tests that call external services and may require credentials",
]

[tool.coverage.run]
source = ["src/agentic_data_pipeline"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
