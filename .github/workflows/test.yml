name: Python tests

# Run this workflow on pushes and pull requests.
on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: ~/.local/bin/uv sync --dev

      - name: Prepare test-results directory
        run: mkdir -p test-results

      # Unit tests deliberately exclude tests that call external services.
      - name: Run unit tests
        run: |
          set -o pipefail
          ~/.local/bin/uv run pytest tests -q -m "not integration" \
            --junitxml=test-results/unit-tests.xml \
            2>&1 | tee test-results/unit-tests.log

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: warn

  finnhub-integration:
    # Repository secrets are not supplied to workflows triggered by forked PRs.
    # Run the real API check on pushes where the repository secret is available.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: ~/.local/bin/uv sync --dev

      - name: Prepare test-results directory
        run: mkdir -p test-results

      - name: Require Finnhub API key
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "FINNHUB_API_KEY repository secret is not configured" >&2
            exit 1
          fi

      - name: Run Finnhub integration tests
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -o pipefail
          ~/.local/bin/uv run pytest tests -q -m integration \
            --junitxml=test-results/finnhub-integration.xml \
            2>&1 | tee test-results/finnhub-integration.log

      - name: Upload Finnhub integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finnhub-integration-results
          path: test-results/
          if-no-files-found: warn

  report-failure:
    name: Report CI failure
    needs:
      - unit-tests
      - finnhub-integration
    # Remediation branches get exactly one automated attempt. Their CI results
    # are visible normally, but failures must never open another issue or start
    # another triage/remediation cycle.
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        !startsWith(github.ref_name, 'remediation/issue-') &&
        (needs.unit-tests.result == 'failure' || needs.finnhub-integration.result == 'failure')
      }}
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.report_issue.outputs.issue_number }}

    steps:
      - name: Create or update CI bug issue
        id: report_issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.finnhub-integration.result }}
        run: |
          set -euo pipefail

          TITLE="CI failure: ${WORKFLOW} on ${BRANCH}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}"

          BODY=$(cat <<EOF
          CI failed on branch \`${BRANCH}\`.

          - **Workflow:** ${WORKFLOW}
          - **Run:** #${RUN_NUMBER}
          - **Unit tests:** ${UNIT_RESULT}
          - **Finnhub integration:** ${INTEGRATION_RESULT}
          - **Commit:** [\`${COMMIT_SHA}\`](${COMMIT_URL})
          - **Triggered by:** @${ACTOR}
          - **Failed run:** ${RUN_URL}

          Test results and logs are attached to the workflow run as GitHub Actions artifacts.

          This issue was created automatically by GitHub Actions.
          EOF
          )

          EXISTING_NUMBER=$(gh issue list \
            --repo "${REPOSITORY}" \
            --state open \
            --label bug \
            --search "${TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -n 1)

          if [ -n "${EXISTING_NUMBER}" ]; then
            ISSUE_NUMBER="${EXISTING_NUMBER}"
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body "${BODY}"
            echo "Updated existing CI failure issue #${ISSUE_NUMBER}."
          else
            ISSUE_URL=$(gh issue create \
              --repo "${REPOSITORY}" \
              --title "${TITLE}" \
              --label bug \
              --body "${BODY}")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
            echo "Created CI failure issue #${ISSUE_NUMBER}."
          fi

          echo "issue_number=${ISSUE_NUMBER}" >> "${GITHUB_OUTPUT}"

  agentic-triage:
    name: Agentic CI triage
    needs:
      - unit-tests
      - finnhub-integration
      - report-failure
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        needs.report-failure.result == 'success' &&
        (needs.unit-tests.result == 'failure' || needs.finnhub-integration.result == 'failure')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: test-artifacts
          merge-multiple: true

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured; agentic triage cannot run." >&2
            exit 1
          fi

      - name: Run Codex root-cause analysis
        id: codex_triage
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt: |
            You are performing read-only root-cause analysis of a failed CI run for
            ${{ github.repository }} at commit ${{ github.sha }}.

            The checked-out repository is the exact failing commit. Machine-readable
            pytest JUnit XML and captured pytest console logs are under:

              test-artifacts/

            CI results:
            - Unit tests: ${{ needs.unit-tests.result }}
            - Finnhub integration tests: ${{ needs.finnhub-integration.result }}
            - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Bug issue: #${{ needs.report-failure.outputs.issue-number }}

            Investigate the test artifacts and repository source to determine the most
            likely root cause. You may inspect source files, tests, configuration, and
            git history using non-destructive commands. Do not modify files, create
            commits, push changes, or attempt remediation.

            Your final response must be a standalone Markdown report with exactly these
            top-level sections:

            # CI Failure Triage

            ## Root cause
            State the most likely root cause clearly. If the available evidence is not
            sufficient for a reliable diagnosis, say that explicitly and give the best
            supported hypothesis rather than presenting speculation as fact.

            ## Evidence
            Cite the failing tests/error messages and relevant repository files and line
            numbers where possible. Explain which observations support the diagnosis.

            ## Reasoning
            Explain how the evidence leads from the observed CI failure to the proposed
            root cause. Mention plausible alternatives that were ruled out when useful.

            ## Proposed fix
            Give a concrete implementation plan, but do not make any changes yourself.

            ## Verification
            Describe the tests or checks that should demonstrate the fix is correct and
            prevent regression.

      - name: Write triage report
        env:
          CODEX_TRIAGE: ${{ steps.codex_triage.outputs.final-message }}
        run: |
          set -euo pipefail
          if [ -z "$CODEX_TRIAGE" ]; then
            echo "Codex returned an empty triage report." >&2
            exit 1
          fi
          printf '%s\n' "$CODEX_TRIAGE" > TRIAGE.md

      - name: Upload triage report
        uses: actions/upload-artifact@v4
        with:
          name: ci-triage-report
          path: TRIAGE.md
          if-no-files-found: error

  publish-triage:
    name: Publish CI triage
    needs:
      - report-failure
      - agentic-triage
    if: >-
      ${{
        always() &&
        needs.report-failure.result == 'success' &&
        needs.agentic-triage.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download triage report
        uses: actions/download-artifact@v4
        with:
          name: ci-triage-report
          path: triage

      - name: Append triage report to CI issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.report-failure.outputs.issue-number }}
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${REPOSITORY}" \
            --body-file triage/TRIAGE.md

  agentic-remediation:
    name: Agentic CI remediation
    needs:
      - unit-tests
      - finnhub-integration
      - report-failure
      - agentic-triage
      - publish-triage
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        needs.report-failure.result == 'success' &&
        needs.agentic-triage.result == 'success' &&
        needs.publish-triage.result == 'success' &&
        (needs.unit-tests.result == 'failure' || needs.finnhub-integration.result == 'failure')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out failing commit on local remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Create local issue remediation branch
        env:
          ISSUE_NUMBER: ${{ needs.report-failure.outputs.issue-number }}
        run: |
          set -euo pipefail
          git checkout -b "remediation/issue-${ISSUE_NUMBER}"

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: test-artifacts
          merge-multiple: true

      - name: Download triage report
        uses: actions/download-artifact@v4
        with:
          name: ci-triage-report
          path: triage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: ~/.local/bin/uv sync --dev

      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured; agentic remediation cannot run." >&2
            exit 1
          fi

      - name: Run Codex remediation
        id: codex_remediation
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          output-file: REMEDIATION.md
          prompt: |
            You are making the single automated remediation attempt for CI bug issue
            #${{ needs.report-failure.outputs.issue-number }} in ${{ github.repository }}.

            You are currently on the dedicated local branch:

              remediation/issue-${{ needs.report-failure.outputs.issue-number }}

            It was created from the exact failing commit ${{ github.sha }}. The root-cause
            analysis is available at:

              triage/TRIAGE.md

            The original pytest JUnit XML and console logs are under:

              test-artifacts/

            First validate the triage diagnosis against the repository and failure
            evidence. Then implement the smallest robust fix that addresses the root
            cause. Add or update regression tests where appropriate.

            You may modify files inside the checked-out workspace and run local tests.
            Dependencies are already installed. Do not access GitHub, create or modify
            issues, create commits, push branches, or open pull requests; later
            deterministic workflow steps handle all GitHub mutations.

            Before finishing, run the relevant failing tests and then, where practical,
            run the non-integration unit test suite:

              ~/.local/bin/uv run pytest tests -q -m "not integration"

            Do not fabricate a fix if the evidence is insufficient. If no safe fix can
            be determined, leave the source unchanged and explain why in your final
            response.

            Your final response should be Markdown headed `# Automated Remediation`
            and summarize the changes made, why they address the diagnosed root cause,
            tests run and their results, and any remaining risks or uncertainty.

      - name: Capture remediation patch
        run: |
          set -euo pipefail
          test -f REMEDIATION.md || {
            echo "Codex did not produce REMEDIATION.md." >&2
            exit 1
          }

          # Intent-to-add makes newly created files visible to git diff without
          # staging their contents for a commit.
          git add -N .

          if git diff --quiet -- .; then
            echo "no-changes" > remediation-status.txt
            : > remediation.patch
          else
            echo "changed" > remediation-status.txt
            git diff --binary --full-index -- . > remediation.patch
          fi

      - name: Upload remediation result
        uses: actions/upload-artifact@v4
        with:
          name: ci-remediation-result
          path: |
            REMEDIATION.md
            remediation-status.txt
            remediation.patch
          if-no-files-found: error

  publish-remediation:
    name: Publish remediation branch
    needs:
      - report-failure
      - agentic-remediation
    if: >-
      ${{
        always() &&
        needs.report-failure.result == 'success' &&
        needs.agentic-remediation.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out failing commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download remediation result
        uses: actions/download-artifact@v4
        with:
          name: ci-remediation-result
          path: remediation-result

      - name: Publish single remediation attempt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.report-failure.outputs.issue-number }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          REMEDIATION_BRANCH="remediation/issue-${ISSUE_NUMBER}"
          STATUS=$(cat remediation-result/remediation-status.txt)

          # A remote issue branch is the durable marker that the one allowed
          # remediation attempt has already been made. This also makes workflow
          # re-runs idempotent: they cannot produce a second automated attempt.
          if git ls-remote --exit-code --heads origin "${REMEDIATION_BRANCH}" >/dev/null 2>&1; then
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body "Automated remediation was not run again because branch \`${REMEDIATION_BRANCH}\` already exists. This issue is limited to one automated remediation attempt."
            exit 0
          fi

          if [ "${STATUS}" != "changed" ]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body-file remediation-result/REMEDIATION.md
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body "Codex did not identify a safe source change, so no remediation branch was pushed. The automated remediation attempt is complete and will not be retried automatically for this workflow run."
            exit 0
          fi

          git checkout -b "${REMEDIATION_BRANCH}"
          git apply --binary --index remediation-result/remediation.patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Attempt automated remediation for issue #${ISSUE_NUMBER}"
          git push origin "HEAD:${REMEDIATION_BRANCH}"

          PR_URL=$(gh pr create \
            --repo "${REPOSITORY}" \
            --base "${BASE_BRANCH}" \
            --head "${REMEDIATION_BRANCH}" \
            --title "Automated remediation for #${ISSUE_NUMBER}" \
            --body "Single automated remediation attempt for #${ISSUE_NUMBER}.\n\nThe branch was produced from the failing commit by Codex using the CI triage report and test artifacts. CI will run on this branch, but failures on \`remediation/issue-*\` branches are explicitly prevented from creating new CI issues or triggering another remediation cycle.\n\nReview the generated changes and CI results before merging.")

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${REPOSITORY}" \
            --body-file remediation-result/REMEDIATION.md

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${REPOSITORY}" \
            --body "Automated remediation branch: \`${REMEDIATION_BRANCH}\`\n\nPull request: ${PR_URL}\n\nThis is the only automated remediation attempt for this issue. If its CI fails, no new CI issue or remediation cycle will be created from that branch."
