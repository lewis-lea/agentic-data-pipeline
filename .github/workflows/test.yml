name: Python tests

# Run this workflow on pushes and pull requests.
on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: ~/.local/bin/uv sync --dev

      # Unit tests deliberately exclude tests that call external services.
      - name: Run unit tests
        run: ~/.local/bin/uv run pytest tests -q -m "not integration"

  finnhub-integration:
    # Repository secrets are not supplied to workflows triggered by forked PRs.
    # Run the real API check on pushes where the repository secret is available.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: ~/.local/bin/uv sync --dev

      - name: Require Finnhub API key
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo "FINNHUB_API_KEY repository secret is not configured" >&2
            exit 1
          fi

      - name: Run Finnhub integration tests
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: ~/.local/bin/uv run pytest tests -q -m integration

  report-failure:
    name: Report CI failure
    needs:
      - unit-tests
      - finnhub-integration
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        (needs.unit-tests.result == 'failure' || needs.finnhub-integration.result == 'failure')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Create or update CI bug issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.finnhub-integration.result }}
        run: |
          set -euo pipefail

          TITLE="CI failure: ${WORKFLOW} on ${BRANCH}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          COMMIT_URL="https://github.com/${REPOSITORY}/commit/${COMMIT_SHA}"

          BODY=$(cat <<EOF
          CI failed on branch \`${BRANCH}\`.

          - **Workflow:** ${WORKFLOW}
          - **Run:** #${RUN_NUMBER}
          - **Unit tests:** ${UNIT_RESULT}
          - **Finnhub integration:** ${INTEGRATION_RESULT}
          - **Commit:** [\`${COMMIT_SHA}\`](${COMMIT_URL})
          - **Triggered by:** @${ACTOR}
          - **Failed run:** ${RUN_URL}

          This issue was created automatically by GitHub Actions.
          EOF
          )

          EXISTING_NUMBER=$(gh issue list \
            --repo "${REPOSITORY}" \
            --state open \
            --label bug \
            --search "${TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" \
            | head -n 1)

          if [ -n "${EXISTING_NUMBER}" ]; then
            gh issue comment "${EXISTING_NUMBER}" \
              --repo "${REPOSITORY}" \
              --body "${BODY}"
            echo "Updated existing CI failure issue #${EXISTING_NUMBER}."
          else
            gh issue create \
              --repo "${REPOSITORY}" \
              --title "${TITLE}" \
              --label bug \
              --body "${BODY}"
          fi
