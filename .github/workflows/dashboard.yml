name: Market dashboard

on:
  push:
    paths:
      - 'dashboard/**'
      - 'config/ftse250-examples.json'
      - 'src/agentic_data_pipeline/**'
      - 'tests/test_dashboard*.py'
      - 'tests/test_synthetic.py'
      - 'pyproject.toml'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'config/ftse250-examples.json'
      - 'src/agentic_data_pipeline/**'
      - 'tests/test_dashboard*.py'
      - 'tests/test_synthetic.py'
      - 'pyproject.toml'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --dev
      - name: Test snapshot exporter
        run: uv run pytest tests/test_dashboard.py tests/test_synthetic.py -q
      - run: npm ci --prefix dashboard --ignore-scripts
      - name: Test chart calculations and controls
        run: npm test --prefix dashboard
      - name: Check dashboard JavaScript
        run: node --check dashboard/app.mjs

  build:
    needs: check
    # Every public artifact is built offline from the synthetic generator.
    # Only the default branch can publish Pages.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - name: Generate synthetic demonstration
        run: uv run python -m agentic_data_pipeline.dashboard --data-source synthetic
      - name: Verify public data provenance
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          root = Path("dashboard-dist")
          prices = json.loads((root / "prices.json").read_text())
          events = json.loads((root / "corporate-actions.json").read_text())
          assert prices["synthetic"] is True and prices["data_source"] == "synthetic"
          assert all(row["synthetic"] is True for row in prices["instruments"])
          assert events["synthetic"] is True and events["data_source"] == "synthetic"
          assert not (root / "datasets/raw/yfinance").exists()
          PY
      - name: Upload dashboard for review
        uses: actions/upload-artifact@v4
        with:
          name: market-dashboard
          path: dashboard-dist/
          include-hidden-files: true
      - name: Upload refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-refresh-status
          path: dashboard-dist/refresh-status.json
          if-no-files-found: warn
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.ENABLE_DASHBOARD_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DASHBOARD_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
